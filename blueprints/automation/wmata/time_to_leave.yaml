blueprint:
  name: WMATA time to leave
  description: >-
    Tells you when to head for the station. When the train you'd take is the
    right number of minutes away, it sends a notification, then stays quiet for
    a while so you get one reminder rather than one per train.


    Works with a commute's "next train" sensor, a station's line-and-direction
    arrival sensor, or a plain Arrivals sensor.
  domain: automation
  author: benlikethecolor
  source_url: https://github.com/benlikethecolor/HomeAssistant-WMATA/blob/main/blueprints/automation/wmata/time_to_leave.yaml
  homeassistant:
    min_version: 2024.12.0
  input:
    next_train:
      name: Train to catch
      description: >-
        A WMATA sensor that counts down in minutes. A commute's "next train"
        sensor is the best fit, because it follows the train your route
        actually uses.
      selector:
        entity:
          filter:
            - integration: wmata
              domain: sensor
    lead_time:
      name: Minutes you need to reach the platform
      description: You're notified when the train is this far away.
      default: 8
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
          mode: box
    travel_time:
      name: Travel time sensor (optional)
      description: >-
        A commute's "travel time" sensor. If you pick one, the message also
        says how long the trip will take.
      default: ""
      selector:
        entity:
          filter:
            - integration: wmata
              domain: sensor
    start_time:
      name: Start watching at
      default: "06:30:00"
      selector:
        time:
    end_time:
      name: Stop watching at
      default: "09:30:00"
      selector:
        time:
    weekdays:
      name: Days
      default: [mon, tue, wed, thu, fri]
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    notify_service:
      name: Notify action (optional)
      description: >-
        The notify action to call, such as notify.mobile_app_your_phone. Leave
        empty if you'd rather build the actions yourself below.
      default: ""
      selector:
        text:
    actions:
      name: Other actions (optional)
      description: >-
        Anything else to run at the same moment, such as a spoken announcement
        or a light. The text of the reminder is available as {{ message }} and
        the minutes until the train as {{ minutes }}.
      default: []
      selector:
        action:
    quiet_period:
      name: Minutes to stay quiet afterwards
      description: Stops a second reminder for the train after the one you caught.
      default: 60
      selector:
        number:
          min: 0
          max: 720
          unit_of_measurement: min
          mode: box

mode: single
max_exceeded: silent

variables:
  next_train: !input next_train
  travel_time: !input travel_time
  lead_time: !input lead_time
  notify_service: !input notify_service
  minutes: "{{ states(next_train) | int(-1) }}"
  message: >-
    {% set trip = states(travel_time) | int(-1) if travel_time else -1 %}
    Time to leave. Your train leaves in {{ minutes }} min{% if trip >= 0 %} and
    you'd arrive in about {{ trip }} min{% endif %}.

triggers:
  # Every countdown update is checked, and so is the start of the window in
  # case a train is already the right distance away at that moment.
  - trigger: state
    entity_id: !input next_train
  - trigger: time
    at: !input start_time

conditions:
  - condition: time
    after: !input start_time
    before: !input end_time
    weekday: !input weekdays
  # A minute of slack, since the countdown can skip a value between updates.
  - condition: template
    value_template: "{{ lead_time | int - 1 <= minutes <= lead_time | int }}"

actions:
  - if: "{{ notify_service | length > 0 }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: Metro
          message: "{{ message }}"
  - choose: []
    default: !input actions
  - delay:
      minutes: !input quiet_period
