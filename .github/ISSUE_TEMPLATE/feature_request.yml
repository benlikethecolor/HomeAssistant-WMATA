name: Feature request
description: Suggest an improvement to the integration or cards.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case. Please check existing requests first.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: How should it work? Examples or sketches are welcome.
    validations:
      required: true
