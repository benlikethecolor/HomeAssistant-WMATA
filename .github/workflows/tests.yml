name: Integration tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ["2026.11.1", stable]
    steps:
      - uses: actions/checkout@v4
      - name: Test packaged integration on Home Assistant
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
        run: |
          python3 tools/build_release.py --output /tmp/wmata-release.zip
          docker run --rm -v "$PWD:/work" -w /work --entrypoint python \
            "ghcr.io/home-assistant/home-assistant:$HA_VERSION" \
            -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
