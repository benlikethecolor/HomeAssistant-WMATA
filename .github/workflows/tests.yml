name: Integration tests
on:
  workflow_call:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ["2024.12.5", "2025.6.3", "2026.1.3", stable]
    steps:
      - uses: actions/checkout@v4
      - name: Test packaged integration on Home Assistant
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
        run: |
          python3 tools/build_release.py --output /tmp/wmata-release.zip
          docker run --rm -v "$PWD:/work" -w /work --entrypoint python \
            "ghcr.io/home-assistant/home-assistant:$HA_VERSION" \
            -m unittest discover -s tests -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
